<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(/fonts/fraunces-italic.woff2);font-style:italic;font-weight:100 900}
@font-face{font-family:A;src:url(/fonts/__anton.woff2)}
@font-face{font-family:I;src:url(/fonts/inter-tight.woff2);font-weight:100 900}
html,body{margin:0}
body{width:1200px;height:630px;background:#F4F1EA;position:relative;overflow:hidden;font-family:I}
.orb{position:absolute;left:600px;top:300px;width:760px;height:760px;translate:-50% -50%;border-radius:50%;
 background:radial-gradient(closest-side,rgba(157,180,160,.8),rgba(157,180,160,.4) 46%,transparent)}
.ring{position:absolute;left:600px;top:300px;width:960px;height:960px;translate:-50% -50%;border-radius:50%;border:1.5px solid rgba(78,106,85,.22)}
.h{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;line-height:.8}
.m{font-family:F;font-style:italic;font-weight:300;font-variation-settings:"opsz" 144;font-size:210px;color:#4E6A55;translate:-22% 0;position:relative;z-index:2;
 -webkit-text-stroke:10px #F4F1EA;paint-order:stroke fill;letter-spacing:-.02em}
.u{font-family:A;font-size:250px;color:#121614;text-transform:uppercase;margin-top:-.3em;translate:4% 0}
.bar{position:absolute;left:56px;right:56px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#3c413e;font-weight:500}
.top{position:absolute;left:56px;top:44px;display:flex;align-items:baseline;gap:10px}
.top i{font-family:F;font-weight:300;font-size:34px;color:#4E6A55}.top b{font-family:A;font-weight:400;font-size:30px;color:#121614}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#E2572B;margin-right:12px}
</style></head><body>
<div class="ring"></div><div class="orb"></div>
<div class="top"><i>Mindful</i><b>MUSCLE</b></div>
<div class="h"><span class="m">Mind</span><span class="u">Muscle</span></div>
<div class="bar"><span><span class="dot"></span>Personal training on The Hill · Boulder</span><span>7AM – 12AM daily</span></div>
</body></html>
